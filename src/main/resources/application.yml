server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/powerup
    username: postgres
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect

appDescription: "Pragma Powerup"
appVersion: "1.0.0"
